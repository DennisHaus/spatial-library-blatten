name: Update point-cloud catalog

on:
  push:
    branches:
      - main
    paths:
      - "scans/**"
      - "scripts/generate_catalog.py"
      - ".github/workflows/update-catalog.yml"

  workflow_dispatch:

concurrency:
  group: update-catalog-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update branch before generating catalog
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Generate catalog.json
        run: |
          python scripts/generate_catalog.py
          echo "Generated catalog:"
          cat catalog.json

      - name: Commit catalog.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json

          if git diff --cached --quiet; then
            echo "catalog.json is already up to date."
            exit 0
          fi

          git commit -m "Automatically update catalog"
          git push origin HEAD:main
